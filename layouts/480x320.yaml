# ============================================================
# espdisplay — 480×320 LANDSCAPE layout
# Board: Guition JC3248W535 (ESP32-S3)
# Rotation: flip from default 9:16 → 16:9 landscape
# ============================================================
# Pages: All Lights → Climate → Temps → Office → Bedroom → Living → Energy
# Each room page shows lights + local temp sensor

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 14
    text_md: 18
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 18
    icons_md: 24
    icons_lg: 32
    icons_xl: 40
    icons_xxl: 48

.sizing:
  - &nav_h          50
  - &nav_pad         8
  - &page
    <<: !include styles/page_styles.yaml
    pad_top: 50
    pad_bottom: 50
  - &container
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
  - &grid2
    <<: !include styles/button_layout.yaml
    pad_column: 8
    pad_row: 8
  - &btn            { width: "49%",  height: 86 }
  - &btn_wide       { width: "100%", height: 86 }
  - &btn_half       { width: "49%",  height: 60 }

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}

lvgl:
  rotation: 90°
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { height: 50, padding: 8 } }
      - <<: !include { file: widgets/footer/widget.yaml,  vars: { height: 50 } }
      - <<: !include { file: widgets/boot_screen/widget.yaml }

  pages:
    # ── splash (auto-skip) ──────────────────────────────────
    - id: splash
      skip: true
      on_load:
        - script.execute: go_home

    # ══════════════════════════════════════════════════════════
    # PAGE 1  🏠  ALL LIGHTS
    # ══════════════════════════════════════════════════════════
    - id: lighting_1
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: All Lights
      widgets:
        - obj:
            <<: *container
            layout: { <<: *grid2 }
            widgets:
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_living, entity_id: light.living_room, text: Living Room, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_office, entity_id: light.office_lm, text: Office, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_kitchen, entity_id: light.kitchen, text: Kitchen, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_computer, entity_id: light.computer, text: Computer, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_bl_r, entity_id: light.hue_play_1, text: Backlight R, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_bl_l, entity_id: light.hue_play_2, text: Backlight L, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_bed, entity_id: light.bedroom, text: Bedroom, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: l_floor, entity_id: light.hue_color_lamp_3_2, text: Floor Lamp, <<: *btn } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: l_outside, icon_on: "\U000F06E8", icon_off: "\U000F0336", text: Outside, <<: *btn } }
                  on_short_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data: { entity_id: switch.outside_lights_switch }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: l_patio, icon_on: "\U000F06E8", icon_off: "\U000F0336", text: Patio, <<: *btn } }
                  on_short_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data: { entity_id: switch.patio_switch }

    # ══════════════════════════════════════════════════════════
    # PAGE 2  ❄️  AIRZONE (climate.climate)
    # ── mode buttons + temp presets, live target/mode readout ──
    # ══════════════════════════════════════════════════════════
    - id: climate
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Airzone
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: COLUMN, pad_row: 7 }
            widgets:
              - obj:
                  width: 100%
                  height: 58
                  widgets:
                    - label:
                        id: climate_target
                        text: "--.-°C"
                        text_font: roboto_xxl
                        align: CENTER
              - obj:
                  width: 100%
                  height: 24
                  widgets:
                    - label:
                        id: climate_state
                        text: "Mode: --"
                        text_font: roboto_md
                        align: CENTER
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 6 }
                  widgets:
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "OFF", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.turn_off
                              data: { entity_id: climate.climate }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "AUTO", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data: { entity_id: climate.climate, hvac_mode: heat_cool }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "COOL", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data: { entity_id: climate.climate, hvac_mode: cool }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "HEAT", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data: { entity_id: climate.climate, hvac_mode: heat }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 6 }
                  widgets:
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "21°C", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "21" }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "23°C", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "23" }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "25°C", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "25" }
                    - button:
                        width: "25%"
                        height: 52
                        widgets:
                          - label: { text: "27°C", text_font: roboto_md, align: CENTER }
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "27" }

    # ══════════════════════════════════════════════════════════
    # PAGE 3  🌡️  ALL TEMPS
    # ══════════════════════════════════════════════════════════
    - id: temps
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Temperatures
      widgets:
        - obj:
            <<: *container
            layout: { <<: *grid2 }
            widgets:
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_office, text: "Office\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_bedroom, text: "Bedroom\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_ufficio, text: "Ufficio\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_z1, text: "Z1\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_z2, text: "Loo\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_z3, text: "Z3\n--.-°C", text_font: roboto_md, align: CENTER }
              - obj:
                  <<: *btn
                  widgets:
                    - label: { id: t_lux, text: "Lux\n--.-°C", text_font: roboto_md, align: CENTER }

    # ══════════════════════════════════════════════════════════
    # PAGE 4  💡  OFFICE (lights + temp)
    # ══════════════════════════════════════════════════════════
    - id: office
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Office
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: COLUMN, pad_row: 8 }
            widgets:
              - obj:
                  width: 100%
                  height: 60
                  widgets:
                    - label: { id: o_temp, text: "--.-°C", text_font: roboto_xl, align: CENTER }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_office, entity_id: light.office_lm, text: Office, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_computer, entity_id: light.computer, text: Computer, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_desk, entity_id: light.hue_ambiance_candle_1, text: Desk Lamp, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_floor, entity_id: light.hue_color_lamp_3, text: Floor Lamp, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_bl_r, entity_id: light.hue_play_1, text: Backlight R, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: o_bl_l, entity_id: light.hue_play_2, text: Backlight L, <<: *btn } }

    # ══════════════════════════════════════════════════════════
    # PAGE 5  🛏️  BEDROOM (lights + temp)
    # ══════════════════════════════════════════════════════════
    - id: bedroom
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Bedroom
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: COLUMN, pad_row: 8 }
            widgets:
              - obj:
                  width: 100%
                  height: 60
                  widgets:
                    - label: { id: b_temp, text: "--.-°C", text_font: roboto_xl, align: CENTER }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_bed, entity_id: light.bedroom, text: Bedroom, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_floor, entity_id: light.hue_color_lamp_3_2, text: Floor Lamp, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_cook1, entity_id: light.hue_ambiance_spot_1, text: Cooktop 1, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_cook2, entity_id: light.bedroom_ambiance_spot_1, text: Cooktop 2, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_candle, entity_id: light.hue_white_candle_1, text: Candle, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: b_strip, entity_id: light.room_lightstrip_plus_1, text: Strip, <<: *btn } }

    # ══════════════════════════════════════════════════════════
    # PAGE 6  🛋️  LIVING ROOM (lights + temp)
    # ══════════════════════════════════════════════════════════
    - id: living_room
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Living Room
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: COLUMN, pad_row: 8 }
            widgets:
              - obj:
                  width: 100%
                  height: 60
                  widgets:
                    - label: { id: lr_temp, text: "--.-°C", text_font: roboto_xl, align: CENTER }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: lr_living, entity_id: light.living_room, text: Lights, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: lr_bulb, entity_id: light.hue_filament_bulb_1, text: Bulb, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: lr_stand, entity_id: light.hue_go_1, text: Stand, <<: *btn } }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: lr_strip, entity_id: light.hue_essential_strip_light_1, text: Strip, <<: *btn } }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: lr_tv, icon_on: "\U000F0425", icon_off: "\U000F0425", text: TV, <<: *btn } }
                        on_short_click:
                          - homeassistant.action:
                              action: media_player.toggle
                              data: { entity_id: media_player.samsung_6_series_55 }
                    - button:
                        <<: !include { file: widgets/buttons/icon_buttons/volume_buttons/vol_up.yaml, vars: { uid: lr_volup, entity_id: media_player.samsung_6_series_55, <<: *btn } }

    # ══════════════════════════════════════════════════════════
    # PAGE 7  ⚡  ENERGY
    # ══════════════════════════════════════════════════════════
    - id: energy
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Power
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: COLUMN, pad_row: 10 }
            widgets:
              - obj:
                  width: 100%
                  height: 70
                  widgets:
                    - label: { id: e_power, text: "---- W", text_font: roboto_xxl, align: CENTER }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - obj:
                        width: "49%"
                        height: 50
                        widgets:
                          - label: { id: e_voltage, text: "--- V", text_font: roboto_md, align: CENTER }
                    - obj:
                        width: "49%"
                        height: 50
                        widgets:
                          - label: { id: e_current, text: "--- A", text_font: roboto_md, align: CENTER }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - obj:
                        width: "49%"
                        height: 50
                        widgets:
                          - label: { id: e_heater, text: "Heater: ----W", text_font: roboto_md, align: CENTER }
                    - button:
                        <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: e_wh, icon_on: "\U000F03EB", icon_off: "\U000F03EC", text: Heater, <<: *btn_half } }
                        on_short_click:
                          - homeassistant.action:
                              action: switch.toggle
                              data: { entity_id: switch.tapo_sock_water_xl }
              - obj:
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
                  widgets:
                    - obj:
                        width: "49%"
                        height: 50
                        widgets:
                          - label: { id: e_today, text: "Today\n--- kWh", text_font: roboto_md, align: CENTER }
                    - obj:
                        width: "49%"
                        height: 50
                        widgets:
                          - label: { id: e_month, text: "Month\n--- kWh", text_font: roboto_md, align: CENTER }

# ══════════════════════════════════════════════════════════════════
# SENSOR PACKAGES
# ══════════════════════════════════════════════════════════════════
packages:
  header_sensors: !include { file: widgets/header/sensors.yaml }
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # ── All Lights ──────────────────────────────────────────
  l_living_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_living, entity_id: light.living_room } }
  l_office_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_office, entity_id: light.office_lm } }
  l_kitchen_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_kitchen, entity_id: light.kitchen } }
  l_computer_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_computer, entity_id: light.computer } }
  l_bl_r_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_bl_r, entity_id: light.hue_play_1 } }
  l_bl_l_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_bl_l, entity_id: light.hue_play_2 } }
  l_bed_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_bed, entity_id: light.bedroom } }
  l_floor_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: l_floor, entity_id: light.hue_color_lamp_3_2 } }
  l_outside_sensors: !include { file: widgets/buttons/icon_buttons/stateful_sensors.yaml, vars: { uid: l_outside, entity_id: switch.outside_lights_switch } }
  l_patio_sensors: !include { file: widgets/buttons/icon_buttons/stateful_sensors.yaml, vars: { uid: l_patio, entity_id: switch.patio_switch } }

  # ── Airzone climate (climate.climate) ────────────────────
  climate_target_s:
    sensor:
      - id: cl_tgt
        platform: homeassistant
        entity_id: climate.climate
        attribute: temperature
        on_value:
          - lvgl.label.update:
              id: climate_target
              text: !lambda 'return (to_string(id(cl_tgt).state) + "°C").c_str();'
  climate_state_s:
    text_sensor:
      - id: cl_mode
        platform: homeassistant
        entity_id: climate.climate
        on_value:
          - lvgl.label.update:
              id: climate_state
              text: !lambda 'return (std::string("Mode: ") + id(cl_mode).state).c_str();'

  # ── Temps page ──────────────────────────────────────────
  t_office_s:
    sensor:
      - id: ts_office
        platform: homeassistant
        entity_id: sensor.zbthermvb_temperature
        on_value:
          - lvgl.label.update:
              id: t_office
              text: !lambda 'return ("Office\n" + to_string(id(ts_office).state) + "°C").c_str();'
  t_bedroom_s:
    sensor:
      - id: ts_bed
        platform: homeassistant
        entity_id: sensor.therm_bedroom_area_temperature
        on_value:
          - lvgl.label.update:
              id: t_bedroom
              text: !lambda 'return ("Bedroom\n" + to_string(id(ts_bed).state) + "°C").c_str();'
  t_ufficio_s:
    sensor:
      - id: ts_ufficio
        platform: homeassistant
        entity_id: sensor.therm_ufficio_temperature
        on_value:
          - lvgl.label.update:
              id: t_ufficio
              text: !lambda 'return ("Ufficio\n" + to_string(id(ts_ufficio).state) + "°C").c_str();'
  t_z1_s:
    sensor:
      - id: ts_z1
        platform: homeassistant
        entity_id: sensor.therm_z1_temperature
        on_value:
          - lvgl.label.update:
              id: t_z1
              text: !lambda 'return ("Z1\n" + to_string(id(ts_z1).state) + "°C").c_str();'
  t_z2_s:
    sensor:
      - id: ts_z2
        platform: homeassistant
        entity_id: sensor.therm_z2_temperature
        on_value:
          - lvgl.label.update:
              id: t_z2
              text: !lambda 'return ("Loo\n" + to_string(id(ts_z2).state) + "°C").c_str();'
  t_z3_s:
    sensor:
      - id: ts_z3
        platform: homeassistant
        entity_id: sensor.therm_z3_temperature
        on_value:
          - lvgl.label.update:
              id: t_z3
              text: !lambda 'return ("Z3\n" + to_string(id(ts_z3).state) + "°C").c_str();'
  t_lux_s:
    sensor:
      - id: ts_lux
        platform: homeassistant
        entity_id: sensor.sensor_temperature
        on_value:
          - lvgl.label.update:
              id: t_lux
              text: !lambda 'return ("Lux\n" + to_string(id(ts_lux).state) + "°C").c_str();'

  # ── Office ──────────────────────────────────────────────
  o_temp_s:
    sensor:
      - id: os_temp
        platform: homeassistant
        entity_id: sensor.zbthermvb_temperature
