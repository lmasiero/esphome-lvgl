                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Office
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_office
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
                    - obj:
                        scrollable: false
                        width: "32%"
                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Bedroom
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_bedroom
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
                    - obj:
                        scrollable: false
                        width: "32%"
                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Ufficio
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_ufficio
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
                    - obj:
                        scrollable: false
                        width: "32%"
                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Zone 1
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_z1
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
                    - obj:
                        scrollable: false
                        width: "32%"
                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Loo
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_z2
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
                    - obj:
                        scrollable: false
                        width: "32%"
                        height: 68
                        radius: 10
                        bg_color: 0x3A4152
                        widgets:
                          - label:
                              text: Zone 3
                              text_font: roboto_sm
                              align: TOP_MID
                              y: 5
                          - label:
                              id: va_z3
                              text: "--.-°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: 4
              - obj: # energy strip
                  width: 100%
                  height: 48
                  radius: 10
                  bg_color: 0x3A4152
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 4 }
                  widgets:
                    - obj:
                        scrollable: false
                        width: "27%"
                        height: 48
                        widgets:
                          - label:
                              id: va_power
                              text: "--- W"
                              text_font: roboto_md
                              align: CENTER
                    - obj:
                        scrollable: false
                        width: "15%"
                        height: 48
                        widgets:
                          - label:
                              id: va_v
                              text: "--- V"
                              text_font: roboto_sm
                              align: CENTER
                    - obj:
                        scrollable: false
                        width: "15%"
                        height: 48
                        widgets:
                          - label:
                              id: va_a
                              text: "--- A"
                              text_font: roboto_sm
                              align: CENTER
                    - obj:
                        scrollable: false
                        width: "19%"
                        height: 48
                        widgets:
                          - label:
                              id: va_today
                              text: "--.- kWh"
                              text_font: roboto_sm
                              align: CENTER
                    - obj:
                        scrollable: false
                        width: "19%"
                        height: 48
                        widgets:
                          - label:
                              id: va_month
                              text: "--.- kWh"
                              text_font: roboto_sm
                              align: CENTER

    # ══════════════════════════════════════════════════════════
    # PAGE  LIGHTS — room groups + all-off + outdoor
    # ══════════════════════════════════════════════════════════
    - id: lights_g
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Lights
      widgets:
        - obj:
            <<: *container
            scrollable: false
            layout: { type: FLEX, flex_flow: ROW_WRAP, flex_align_main: SPACE_BETWEEN, pad_row: 8 }
            widgets:
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: g_living, entity_id: light.living_room, text: Living, width: "32%", height: 58 } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: g_office, entity_id: light.office_lm, text: Office, width: "32%", height: 58 } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: g_computer, entity_id: light.computer, text: Computer, width: "32%", height: 58 } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: g_kitchen, entity_id: light.kitchen, text: Kitchen, width: "32%", height: 58 } }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml, vars: { uid: g_bed, entity_id: light.bedroom, text: Bedroom, width: "32%", height: 58 } }
              - button:
                  width: "32%"
                  height: 66
                  text: "ALL OFF"
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_off
                        data: { entity_id: "light.living_room, light.office_lm, light.computer, light.kitchen, light.bedroom" }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: g_outside, icon_on: "\U000F06E8", icon_off: "\U000F0336", text: Outside, width: "32%", height: 58 } }
                  on_short_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data: { entity_id: switch.outside_lights_switch }
              - button:
                  <<: !include { file: widgets/buttons/icon_text_buttons/stateful.yaml, vars: { uid: g_patio, icon_on: "\U000F06E8", icon_off: "\U000F0336", text: Patio, width: "32%", height: 58 } }
                  on_short_click:
                    - homeassistant.action:
                        action: switch.toggle
