# ============================================================
# ESPHome LVGL layout test suite — espdisplay (Guition JC3248W535)
#
# 4 layout variants, each = AC control page + values page:
#   A  Arc        — thermostat arc + icon modes + fan chips
#   B  Slider     — ± slider + preset chips + segmented modes
#   C  Matrix     — hero setpoint + 2x3 mode matrix + fan dropdown
#   D  Zones      — arc + live zone temps + compact modes
#
# Geometry is orientation-specific:
#   test-480x320.yaml  → landscape 4:3 (rotation 90°)
#   test-320x480.yaml  → portrait  3:4 (native, no rotation)
# Shared HA wiring lives in test-sensors.yaml (one sensor per
# entity, every variant's labels updated from the same value).
# ============================================================

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 14
    text_md: 18
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 18
    icons_md: 24
    icons_lg: 32
    icons_xl: 40
    icons_xxl: 48

.sizing:
  - &page
    <<: !include styles/page_styles.yaml
    pad_top: 50
    pad_bottom: 50
    scrollable: false
  - &container
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollable: false

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}
  # slider release → send setpoint (script has no trigger args, so the
  # templated data lambda below stays signature-clean; the value is read
  # via the LVGL C API because id() outside lvgl yields a raw lv_obj_t*)
  - id: b_apply_slider
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: climate.climate
            temperature: !lambda 'return to_string((int) lv_slider_get_value(id(b_slider)));'

lvgl:
  rotation: 90°
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { height: 50, padding: 8 } }
      - <<: !include { file: widgets/footer/widget.yaml,  vars: { height: 50 } }
      - <<: !include { file: widgets/notify_banner.yaml }
      - <<: !include { file: widgets/boot_screen/widget.yaml }

  pages:
    # ── splash (auto-skip) ──────────────────────────────────
    - id: splash
      skip: true
      on_load:
        - script.execute: go_home

    # ══════════════════════════════════════════════════════════
    # VARIANT A — ARC · AC control page
    # ══════════════════════════════════════════════════════════
    - id: ac_a
      <<: *page
      on_load:
        - lvgl.label.update:
            id: page_title
            text: AC A Arc
      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: ROW, pad_column: 6 }
            widgets:
              # left: thermostat arc + ± + room temp
              - obj:
                  scrollable: false
                  width: 45%
                  height: 100%
                  layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 4 }
                  widgets:
                    - arc:
                        id: a_arc
                        width: 118
                        height: 118
                        min_value: 15
                        max_value: 30
                        value: 25
                        adjustable: false
                        widgets:
                          - label:
                              id: a_tgt
                              text: "--°C"
                              text_font: roboto_lg
                              align: CENTER
                              y: -10
                          - label:
                              id: a_room
                              text: "--.-°C"
                              text_font: roboto_sm
                              align: CENTER
                              y: 16
                    - obj:
                        scrollable: false
                        width: 100%
                        height: 44
                        layout: { type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 8 }
                        widgets:
                          - button:
                              id: a_dn
                              width: 42
                              height: 42
                              radius: 21
                              widgets:
                                - label:
                                    text: "\U000F0374"
                                    text_font: mdi_md
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t - 1.0f)));
                              on_long_press_repeat:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t - 1.0f)));
                          - button:
                              id: a_up
                              width: 42
                              height: 42
                              radius: 21
                              widgets:
                                - label:
                                    text: "\U000F0415"
                                    text_font: mdi_md
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t + 1.0f)));
                              on_long_press_repeat:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t + 1.0f)));
              # right: badge + mode grid + fan chips
              - obj:
                  scrollable: false
                  width: 55%
                  height: 100%
                  layout: { type: FLEX, flex_flow: COLUMN, pad_row: 5 }
                  widgets:
                    - obj:
                        scrollable: false
                        width: 100%
                        height: 18
                        widgets:
                          - label:
                              id: a_act
                              text: " "
                              text_font: roboto_sm
                              align: CENTER
                    - obj:
                        scrollable: false
                        width: 100%
                        flex_grow: 1
                        layout: { type: FLEX, flex_flow: ROW_WRAP, flex_align_main: SPACE_BETWEEN, pad_row: 5 }
                        widgets:
                          - button:
                              id: a_m_off
                              width: "32%"
                              height: 44
                              text: "OFF"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.turn_off
                                    data: { entity_id: climate.climate }
                          - button:
                              id: a_m_auto
                              width: "32%"
                              height: 44
                              text: "AUTO"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: heat_cool }
                          - button:
                              id: a_m_cool
                              width: "32%"
                              height: 44
                              text: "COOL"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: cool }
                          - button:
                              id: a_m_heat
                              width: "32%"
                              height: 44
                              text: "HEAT"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: heat }
                          - button:
                              id: a_m_fan
                              width: "32%"
                              height: 44
                              text: "FAN"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: fan_only }
                          - button:
                              id: a_m_dry
                              width: "32%"
                              height: 44
                              text: "DRY"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: dry }
                    - obj:
                        scrollable: false
                        width: 100%
                        height: 28
                        layout: { type: FLEX, flex_flow: ROW, pad_column: 4 }
                        widgets:
                          - button:
                              id: a_f_auto
                              width: "19%"
                              height: 28
                              widgets:
                                - label:
                                    text: AUTO
                                    text_font: roboto_sm
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data: { entity_id: climate.climate, fan_mode: auto }
                          - button:
                              id: a_f_25
                              width: "19%"
                              height: 28
                              widgets:
                                - label:
                                    text: "25%"
                                    text_font: roboto_sm
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data: { entity_id: climate.climate, fan_mode: "25%" }
                          - button:
                              id: a_f_50
                              width: "19%"
                              height: 28
                              widgets:
                                - label:
                                    text: "50%"
                                    text_font: roboto_sm
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data: { entity_id: climate.climate, fan_mode: "50%" }
                          - button:
                              id: a_f_75
                              width: "19%"
                              height: 28
                              widgets:
                                - label:
                                    text: "75%"
                                    text_font: roboto_sm
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data: { entity_id: climate.climate, fan_mode: "75%" }
                          - button:
                              id: a_f_100
                              width: "19%"
                              height: 28
                              widgets:
                                - label:
                                    text: "100%"
                                    text_font: roboto_sm
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data: { entity_id: climate.climate, fan_mode: "100%" }

    # ══════════════════════════════════════════════════════════
