                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "20" }
                    - button:
                        id: b_p22
                        width: "18.5%"
                        height: 34
                        text: "22"
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "22" }
                    - button:
                        id: b_p24
                        width: "18.5%"
                        height: 34
                        text: "24"
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "24" }
                    - button:
                        id: b_p26
                        width: "18.5%"
                        height: 34
                        text: "26"
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "26" }
                    - button:
                        id: b_p28
                        width: "18.5%"
                        height: 34
                        text: "28"
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data: { entity_id: climate.climate, temperature: "28" }
              - obj: # modes, 6 segmented
                  width: 100%
                  height: 38
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 4 }
                  widgets:
                    - button:
                        id: b_m_off
                        width: "15.2%"
                        height: 38
                        text: "OFF"
                        on_short_click:
                          - homeassistant.action:
                              action: climate.turn_off
                              data: { entity_id: climate.climate }
                    - button:
                        id: b_m_auto
                        width: "15.2%"
                        height: 38
                        text: AUTO
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data: { entity_id: climate.climate, hvac_mode: heat_cool }
                    - button:
                        id: b_m_cool
                        width: "15.2%"
                        height: 38
                        text: COOL
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data: { entity_id: climate.climate, hvac_mode: cool }
                    - button:
                        id: b_m_heat
                        width: "15.2%"
                        height: 38
