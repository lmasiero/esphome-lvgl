              - obj: # ± + big setpoint + room
                  width: 100%
                  height: 54
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 10, flex_align_cross: CENTER }
                  widgets:
                    - button:
                        id: b_dn
                        width: 46
                        height: 46
                        radius: 23
                        widgets:
                          - label:
                              text: "\U000F0374"
                              text_font: mdi_md
                              align: CENTER
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data:
                                entity_id: climate.climate
                                temperature: !lambda |-
                                  float t = id(sh_tgt).state;
                                  if (isnan(t)) t = 25.0;
                                  return to_string((int) std::min(30.0f, std::max(15.0f, t - 1.0f)));
