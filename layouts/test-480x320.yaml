                    - obj: # center block: setpoint
                        flex_grow: 1
                        height: 54
                        widgets:
                          - label:
                              id: b_tgt
                              text: "--°C"
                              text_font: roboto_xl
                              align: CENTER
                    - button:
                        id: b_up
                        width: 46
                        height: 46
                        radius: 23
                        widgets:
                          - label:
                              text: "\U000F0415"
                              text_font: mdi_md
                              align: CENTER
                        on_short_click:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data:
                                entity_id: climate.climate
                                temperature: !lambda |-
                                  float t = id(sh_tgt).state;
                                  if (isnan(t)) t = 25.0;
                                  return to_string((int) std::min(30.0f, std::max(15.0f, t + 1.0f)));
                        on_long_press_repeat:
                          - homeassistant.action:
                              action: climate.set_temperature
