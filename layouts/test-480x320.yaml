      widgets:
        - obj:
            <<: *container
            layout: { type: FLEX, flex_flow: ROW, pad_column: 8 }
            widgets:
              # left: hero setpoint + ± + badge
              - obj:
                  scrollable: false
                  width: 38%
                  height: 100%
                  layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, pad_row: 6 }
                  widgets:
                    - label:
                        id: c_tgt
                        text: "--°C"
                        text_font: roboto_xxl
                    - obj:
                        scrollable: false
                        width: 100%
                        height: 44
                        layout: { type: FLEX, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 10 }
                        widgets:
                          - button:
                              id: c_dn
                              width: 44
                              height: 44
                              radius: 22
                              widgets:
                                - label:
                                    text: "\U000F0374"
                                    text_font: mdi_md
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t - 1.0f)));
                              on_long_press_repeat:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t - 1.0f)));
                          - button:
                              id: c_up
                              width: 44
                              height: 44
                              radius: 22
                              widgets:
                                - label:
                                    text: "\U000F0415"
                                    text_font: mdi_md
                                    align: CENTER
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t + 1.0f)));
                              on_long_press_repeat:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: climate.climate
                                      temperature: !lambda |-
                                        float t = id(sh_tgt).state;
                                        if (isnan(t)) t = 25.0;
                                        return to_string((int) std::min(30.0f, std::max(15.0f, t + 1.0f)));
                    - label:
                        id: c_room
                        text: "--.-°C"
                        text_font: roboto_sm
                    - label:
                        id: c_act
                        text: " "
                        text_font: roboto_sm
              # right: 2x3 mode matrix + fan dropdown
              - obj:
                  scrollable: false
                  width: 62%
                  height: 100%
                  layout: { type: FLEX, flex_flow: COLUMN, pad_row: 6 }
                  widgets:
                    - obj:
                        scrollable: false
                        width: 100%
                        flex_grow: 1
                        layout: { type: FLEX, flex_flow: ROW_WRAP, flex_align_main: SPACE_BETWEEN, pad_row: 6 }
                        widgets:
                          - button:
                              id: c_m_off
                              width: "48%"
                              height: 38
                              text: "OFF"
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.turn_off
                                    data: { entity_id: climate.climate }
                          - button:
                              id: c_m_auto
                              width: "48%"
                              height: 38
                              text: AUTO
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: heat_cool }
                          - button:
                              id: c_m_cool
                              width: "48%"
                              height: 38
                              text: COOL
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: cool }
                          - button:
                              id: c_m_heat
                              width: "48%"
                              height: 38
                              text: HEAT
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: heat }
                          - button:
                              id: c_m_fan
                              width: "48%"
                              height: 38
                              text: FAN
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: fan_only }
                          - button:
                              id: c_m_dry
                              width: "48%"
                              height: 38
                              text: DRY
                              on_short_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data: { entity_id: climate.climate, hvac_mode: dry }
                    - dropdown:
                        id: c_fan_dd
                        width: 100%
                        height: 36
                        options: ["auto", "25%", "50%", "75%", "100%"]
                        on_value:
                          - if:
                              condition:
                                lambda: 'return id(gl_fan_armed);'
                              then:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data:
                                      entity_id: climate.climate
                                      fan_mode: !lambda |-
                                        static const char* const fans[] = {"auto", "25%", "50%", "75%", "100%"};
                                        int idx = id(c_fan_dd).get_selected_index();
                                        return std::string(fans[(idx >= 0 && idx < 5) ? idx : 0]);

